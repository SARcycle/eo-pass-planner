# Satellite family registry.
#
# Each family maps catalogue entries to metadata used for filtering and to the
# viewing geometry the sensor can achieve. Satellites are matched by
#
#   norad:       [catalogue numbers]                 checked first
#   cospar:      [COSPAR ids or prefixes, e.g. 2024-149]
#   pattern:     regex on the satellite name; dashes, underscores and spaces
#                are interchangeable and optional
#
#   type:        sar | optical
#   look_side:   left | right | both        (direction the sensor can point)
#   incidence:   [min, max] ellipsoid incidence angle at the target, degrees
#                (used for SAR)
#   off_nadir:   [min, max] off-nadir angle at the satellite, degrees
#                (used for optical; also accepted for SAR)
#   min_sun_elevation: optical only; passes with the sun lower than this at the
#                target are dropped (degrees)
#   bands:       optical only; nadir GSD (m) per band group: pan, vis (blue,
#                green, red), nir, rededge, swir, tir. Either one mapping or
#                {name regex: mapping} when satellites differ.
#   gsd:         shorthand when the bands are not known: finest GSD at nadir
#
# Angles and GSDs are approximate public figures. Override them on the command
# line, or add and change families in your own registry file, which is merged
# over this one (see README, --show-registry).

families:
  # ------------------------------------------------------------------ SAR ---
  ICEYE:
    pattern: '^ICEYE'
    type: sar
    operator: ICEYE
    country: Finland
    look_side: both
    incidence: [10, 45]
  Capella:
    pattern: '^CAPELLA'
    type: sar
    operator: Capella Space
    country: USA
    look_side: both
    incidence: [5, 50]
  Umbra:
    pattern: '^UMBRA'
    type: sar
    operator: Umbra
    country: USA
    look_side: both
    incidence: [10, 55]
  StriX:
    pattern: '^STRIX'
    type: sar
    operator: Synspective
    country: Japan
    look_side: both
    incidence: [15, 45]
  QPS-SAR:
    pattern: '^QPS-SAR'
    type: sar
    operator: iQPS
    country: Japan
    look_side: both
    incidence: [15, 45]
  Sentinel-1:
    pattern: '^SENTINEL-1'
    type: sar
    operator: ESA
    country: EU
    look_side: right
    incidence: [19, 47]
  TerraSAR-X/TanDEM-X/PAZ:
    pattern: '^(TERRASAR-X|TANDEM-X|PAZ)$'
    type: sar
    operator: DLR / Airbus / Hisdesat
    country: Germany, Spain
    look_side: right
    incidence: [15, 60]
  COSMO-SkyMed:
    pattern: '^(COSMO-SKYMED|CSG)'
    type: sar
    operator: ASI
    country: Italy
    look_side: both
    incidence: [15, 60]
  RADARSAT-2:
    pattern: '^RADARSAT-2'
    type: sar
    operator: MDA
    country: Canada
    look_side: both
    incidence: [10, 60]
  RCM:
    pattern: '^RCM-'
    type: sar
    operator: CSA
    country: Canada
    look_side: right
    incidence: [10, 60]
  ALOS:
    pattern: '^ALOS-[24]'
    type: sar
    operator: JAXA
    country: Japan
    look_side: both
    incidence: [8, 70]
  SAOCOM:
    pattern: '^SAOCOM'
    type: sar
    operator: CONAE
    country: Argentina
    look_side: both
    incidence: [20, 50]
  NISAR:
    pattern: '^NISAR$'
    type: sar
    operator: NASA / ISRO
    country: USA, India
    look_side: left
    incidence: [33, 47]
  NovaSAR:
    pattern: '^NOVASAR'
    type: sar
    operator: SSTL
    country: UK
    look_side: right
    incidence: [15, 70]
  TeLEOS-2:
    pattern: '^TELEOS-2'
    type: sar
    operator: ST Engineering
    country: Singapore
    look_side: both
    incidence: [15, 45]

  SuperView-Neo-2:                # SAR, unlike the other SuperViews
    pattern: '^SUPERVIEW NEO-2'
    type: sar
    operator: Siwei / CGSTL
    country: China
    look_side: both

  # -------------------------------------------------------------- optical ---
  Sentinel-2:
    pattern: '^SENTINEL-2'
    type: optical
    operator: ESA
    country: EU
    look_side: both
    off_nadir: [0, 10.5]
    min_sun_elevation: 0
    bands: {vis: 10, nir: 10, rededge: 20, swir: 20}
  Landsat:
    pattern: '^LANDSAT [89]'
    type: optical
    operator: USGS / NASA
    country: USA
    look_side: both
    off_nadir: [0, 7.5]
    min_sun_elevation: 0
    bands: {pan: 15, vis: 30, nir: 30, swir: 30, tir: 100}
  Pleiades:
    pattern: '^PLEIADES 1'
    type: optical
    operator: Airbus
    country: France
    look_side: both
    off_nadir: [0, 30]
    min_sun_elevation: 10
    bands: {pan: 0.70, vis: 2.8, nir: 2.8}
  Pleiades-Neo:
    pattern: '^PLEIADES NEO'
    type: optical
    operator: Airbus
    country: France
    look_side: both
    off_nadir: [0, 30]
    min_sun_elevation: 10
    bands: {pan: 0.30, vis: 1.2, nir: 1.2, rededge: 1.2}
  SPOT:
    pattern: '^SPOT [67]'
    type: optical
    operator: Airbus
    country: France
    look_side: both
    off_nadir: [0, 30]
    min_sun_elevation: 10
    bands: {pan: 1.5, vis: 6.0, nir: 6.0}
  CO3D:
    pattern: '^CO3D'
    type: optical
    operator: CNES / Airbus
    country: France
    look_side: both
    off_nadir: [0, 30]
    min_sun_elevation: 10
    bands: {vis: 0.50, nir: 0.50}
  WorldView:
    pattern: '^WORLDVIEW'
    type: optical
    operator: Maxar
    country: USA
    look_side: both
    off_nadir: [0, 45]
    min_sun_elevation: 10
    bands:
      'WORLDVIEW-1': {pan: 0.50}
      'WORLDVIEW-2': {pan: 0.46, vis: 1.84, nir: 1.84, rededge: 1.84}
      'WORLDVIEW-3': {pan: 0.31, vis: 1.24, nir: 1.24, rededge: 1.24, swir: 3.7}
  WorldView-Legion:
    pattern: '^LEGION'
    type: optical
    operator: Maxar
    country: USA
    look_side: both
    off_nadir: [0, 45]
    min_sun_elevation: 10
    bands: {pan: 0.34, vis: 1.36, nir: 1.36, rededge: 1.36}
  SkySat:
    pattern: '^SKYSAT'
    type: optical
    operator: Planet
    country: USA
    look_side: both
    off_nadir: [0, 30]
    min_sun_elevation: 10
    bands:                     # A, B = SkySat-1, 2; Cn = SkySat-(n+2)
      'SKYSAT-[AB]': {pan: 0.86, vis: 1.0, nir: 1.0}
      'SKYSAT-C1[4-9]\b': {pan: 0.58, vis: 0.72, nir: 0.72}
      'SKYSAT-C': {pan: 0.65, vis: 0.81, nir: 0.81}
  PlanetScope:
    pattern: '^FLOCK'
    type: optical
    operator: Planet
    country: USA
    look_side: both
    off_nadir: [0, 3]
    min_sun_elevation: 10
    bands: {vis: 3.7, nir: 3.7, rededge: 3.7}
  SuperView:
    pattern: '^SUPERVIEW'
    type: optical
    operator: Siwei / CGSTL
    country: China
    look_side: both
    off_nadir: [0, 45]
    min_sun_elevation: 10
    bands:                     # Neo-3 unknown
      'SUPERVIEW-1': {pan: 0.50, vis: 2.0, nir: 2.0}
      'SUPERVIEW NEO-1': {pan: 0.30, vis: 1.2, nir: 1.2}
  KOMPSAT:
    pattern: '^KOMPSAT-(3A|7)'
    type: optical
    operator: KARI
    country: South Korea
    look_side: both
    off_nadir: [0, 30]
    min_sun_elevation: 10
    bands:
      'KOMPSAT-3A': {pan: 0.55, vis: 2.2, nir: 2.2}
      'KOMPSAT-7': {pan: 0.30, vis: 1.2, nir: 1.2}
