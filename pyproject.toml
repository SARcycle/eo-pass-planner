[project]
name = "eo-pass-planner"
version = "0.1.0"
description = "Predict satellite passes over a location and the acquisition geometry (heading, ASC/DESC, look side, incidence)"
readme = "README.md"
authors = [
    { name = "SARCycle", email = "57989133+SARcycle@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "sgp4>=2.20",
]

[project.scripts]
eo-pass-planner = "eo_pass_planner:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "skyfield>=1.49",
]
